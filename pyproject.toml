[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "palm-tree"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["typer==0.26.7"]

[project.scripts]
palm-tree = "palm_tree.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
