[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "palm-tree"
version = "0.1.0"
description = "CLI tools for mining git repositories for maintenance and evolution signals."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["typer==0.26.7"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
palm-tree = "palm_tree.cli:app"

[project.urls]
Repository = "https://github.com/justbrendo/palm-tree"
Issues = "https://github.com/justbrendo/palm-tree/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
palm_tree = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
